<!--body section-->
<body>

    <div class="wrapper">

        <div class="header">
            <a href="index.html"><img src="icons/Sign026.ico" style="width: 20px; margin: 0 0 -11px; padding-right: 10px;"></a>
            <div class="panel" style="width: 70%;"><img src="icons/Display027.ico" style="width: 20px; height: 20px;">&nbsp;&nbsp;/&nbsp;&nbsp;nick's blog</div>
            <input type="text" class="panel" style="width: 25%;" id="myInput" onkeyup="myFunction()" placeholder="search me!">

        </div>

        <ul id="myUL" class="container">

            <li class="panel" style="height: 20px; width: 97.5%;"><a href="#" style="color: black; text-decoration: none;">empty blog post placeholder</a></li>
            <li class="panel" style="height: 20px; width: 97.5%;"><a href="#" style="color: black; text-decoration: none;">An Argument Against the Current Methods of AI Development</a></li>
            <li class="panel" style="height: 20px; width: 97.5%;"><a href="#" style="color: black; text-decoration: none;">alpha</a></li>

        </ul>

    </div>
<!-- script grabbed from w3schools-->
<script>
function myFunction() {
  // Declare variables
  var input, filter, ul, li, a, i, txtValue;
  input = document.getElementById('myInput');
  filter = input.value.toUpperCase();
  ul = document.getElementById("myUL");
  li = ul.getElementsByTagName('li');

  // Loop through all list items, and hide those who don't match the search query
  for (i = 0; i < li.length; i++) {
    a = li[i].getElementsByTagName("a")[0];
    txtValue = a.textContent || a.innerText;
    if (txtValue.toUpperCase().indexOf(filter) > -1) {
      li[i].style.display = "";
    } else {
      li[i].style.display = "none";
    }
  }
}
</script>

</body>


</html>
